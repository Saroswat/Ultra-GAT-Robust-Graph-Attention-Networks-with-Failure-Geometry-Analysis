dataset: CiteSeer
model: gatv2
seed: 42
hidden_channels: 64
heads: 8
layers: 3
dropout: 0.55
dropedge: 0.20
feature_mask: 0.05
learning_rate: 0.005
weight_decay: 0.0005
epochs: 500
patience: 80
structural_features: true
label_propagation_alpha: 0.90
label_propagation_steps: 50
auxiliary_weight: 0.10
temperature_calibration: true
